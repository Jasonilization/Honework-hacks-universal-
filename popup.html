<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Sparx AI</title>
  <link rel="stylesheet" href="src/popup/popup.css">
</head>

<body>
  <div id="app">

    <header class="hdr">
      <div class="hdr-id">
        <img class="hdr-logo" src="icons/icon32.png" alt="">
        <span class="hdr-name">Sparx AI</span>
      </div>
      <div class="hdr-actions">
        <span id="status" class="status" role="status" aria-live="polite" data-state="idle">
          <span id="statusDot" class="status-dot"></span>
          <span id="statusText">Loading…</span>
        </span>
        <button id="btnSettings" class="icon-btn" title="Settings" aria-label="Settings"
          aria-expanded="false" aria-controls="settingsPanel">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor"
            stroke-width="1.4" aria-hidden="true">
            <circle cx="8" cy="8" r="2.2" />
            <path d="M8 1.8v1.6M8 12.6v1.6M1.8 8h1.6M12.6 8h1.6M3.6 3.6l1.1 1.1M11.3 11.3l1.1 1.1M12.4 3.6l-1.1 1.1M4.7 11.3l-1.1 1.1" />
          </svg>
        </button>
      </div>
    </header>

    <main class="content" id="content">

      <div id="detectedBar" class="detected-bar" hidden></div>

      <section id="resultCard" class="card" hidden></section>

      <div class="action-row">
        <button id="btnAnalyze" class="btn btn-primary">Analyze screen</button>
        <button id="btnCancel" class="btn" hidden>Cancel</button>
      </div>
      <p class="action-hint">Captures the visible tab and solves the maths question on it.</p>

    </main>

    <details id="settingsPanel" class="settings">
      <summary>
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor"
          stroke-width="1.4" aria-hidden="true">
          <path d="M8 1.8v1.6M8 12.6v1.6M1.8 8h1.6M12.6 8h1.6M3.6 3.6l1.1 1.1M11.3 11.3l1.1 1.1M12.4 3.6l-1.1 1.1M4.7 11.3l-1.1 1.1" />
        </svg>
        Settings
      </summary>

      <div class="settings-body">

        <div class="setting-group">
          <div class="setting">
            <label for="providerSelect">Provider</label>
            <select id="providerSelect"></select>
            <p class="setting-desc">Where your answers come from. Keys are stored only in this browser.</p>
          </div>

          <div class="setting">
            <label for="modelSelect">Model</label>
            <select id="modelSelect"></select>
            <div class="setting-inline" id="customModelWrap" hidden>
              <label for="customModelInput">Custom model ID</label>
              <input id="customModelInput" type="text" spellcheck="false" autocomplete="off"
                placeholder="vendor/model-id">
            </div>
          </div>

          <div class="setting">
            <label for="apiKeyInput">API key</label>
            <div class="key-row">
              <input id="apiKeyInput" type="password" spellcheck="false" autocomplete="off"
                placeholder="Paste your API key">
              <button id="btnEye" class="icon-btn" aria-label="Show API key">
                <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor"
                  stroke-width="1.4" aria-hidden="true">
                  <path d="M1.5 8s2.4-4.2 6.5-4.2S14.5 8 14.5 8s-2.4 4.2-6.5 4.2S1.5 8 1.5 8Z" />
                  <circle cx="8" cy="8" r="1.8" />
                </svg>
              </button>
            </div>
            <div class="key-actions">
              <button id="btnTest" class="btn btn-small">Test connection</button>
              <span id="testStatus" class="test-status" role="status" aria-live="polite"></span>
            </div>
          </div>
        </div>

        <div class="setting-group">
          <div class="setting">
            <label for="themeSelect">Theme</label>
            <select id="themeSelect">
              <option value="system">System</option>
              <option value="light">Light</option>
              <option value="dark">Dark</option>
            </select>
          </div>

          <div class="setting setting-toggle">
            <label for="includeWorkingToggle">Include working</label>
            <p class="setting-desc">Show step-by-step working under each answer.</p>
            <input type="checkbox" id="includeWorkingToggle" class="switch">
          </div>
        </div>

      </div>
    </details>

    <footer class="foot">
      <span>AI answers can be wrong — always check them.</span>
      <span id="footVersion"></span>
    </footer>

  </div>

  <script type="module" src="src/popup/popup.js"></script>
</body>

</html>
